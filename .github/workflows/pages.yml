name: Pages

# Publishes the landing page on GitHub Pages
# (https://vivi7.github.io/switchboard-evolution-site/).
#
# The page reads the releases of vivi7/switchboard-evolution live from GitHub.
# Before each deploy, scripts/releases.mjs writes releases.json, the copy the
# page falls back on when GitHub's API does not answer; the daily run keeps
# that copy fresh.
#
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub
# Actions (or: gh api -X POST repos/OWNER/REPO/pages -f build_type=workflow).

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: The releases, as a fallback for the page
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/releases.mjs

      # Only what the page serves: no scripts, no notes.
      - name: Put the site together
        run: |
          mkdir _site
          cp -R index.html styles.css main.js releases.json 404.html assets _site/
          # the images' provenance notes stay in the repository
          find _site/assets -name '*.json' -delete

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
